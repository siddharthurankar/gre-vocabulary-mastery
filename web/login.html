<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private GRE sign-in</title><link rel="stylesheet" href="style.css"></head><body><main style="margin:0"><div id="app" class="study-layout"><div class="eyebrow">PRIVATE STUDY SPACE</div><h1 class="page-title">Your study space.</h1><p>Sign in to your private GRE server. First-time login creation must happen on the laptop.</p><form id="login"><div class="panel"><div class="toolbar"><label>Username <input name="user" autocomplete="username" value="student" required></label><label>Password <input name="password" type="password" autocomplete="current-password" minlength="12" required></label></div><button class="btn primary" type="submit">Sign in</button> <button class="btn" type="button" id="setup">Create private login</button><p id="status" role="status"></p></div></form></div></main><script type="module" src="login.mjs"></script></body></html>
